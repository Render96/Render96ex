# File: .github/workflows/build-switch.yml
name: Build Render96ex for Switch

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_native:
    name: Build Native on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libpng-dev \
            libopenal-dev

      - name: Build Native Host Tools
        run: make -j$(nproc)

      - name: Upload Host Tools Artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-tools
          path: |
            tools        # contains n64graphics, extract_assets.py, etc.
            build/us_pc  # optional PC build output (not strictly needed for Switch)
