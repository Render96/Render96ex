# File: .github/workflows/build-switch.yml
name: Build Render96ex for Switch

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_switch:
    name: Build Render96ex (host tools + Switch) inside devkitpro/devkita64
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Host Dependencies
        # In order for `make -C tools` to compile host‐side executables (n64graphics, etc.),
        # we need a C compiler and PNG libraries inside the container.
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            libpng-dev \
            zlib1g-dev \
            python3

      - name: Configure devkitPro Environment
        shell: bash
        run: |
          . /opt/devkitpro/switchvars.sh

      - name: Build Native Host Tools + Build for Switch
        run: |
          # First, `make` will build host tools (tools/n64graphics, etc.),
          # then run extract_assets.py, then compile the Switch binary.
          make TARGET_SWITCH=1 MODELPACK=0 HIGHFPS=1 TEXTURE_FIX=1 -j$(nproc)

      - name: Upload Switch Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-build
          path: build
