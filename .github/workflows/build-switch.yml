# File: .github/workflows/build-switch.yml
name: Build Render96ex for Switch

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_native:
    name: Build Native on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libpng-dev \
            libopenal-dev \
            libsdl2-dev

      - name: Build Native Host Tools
        run: make -j$(nproc)

      - name: Upload Host Tools Artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-tools
          path: |
            tools
            build/us_pc

  build_switch:
    name: Build for Nintendo Switch
    needs: build_native
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Host Tools Artifact
        uses: actions/download-artifact@v4
        with:
          name: host-tools
          path: tools

      - name: Configure devkitPro Environment
        run: source /opt/devkitpro/switchvars.sh

      - name: Build Render96ex for Switch
        run: |
          make TARGET_SWITCH=1 MODELPACK=0 HIGHFPS=1 TEXTURE_FIX=1 -j$(nproc)

      - name: Upload Switch Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-build
          path: build
